name: CI Quality Gate

on:
  pull_request:
    branches: [main, 'fix/audit-*']
  push:
    branches: [main, 'fix/audit-*']

jobs:
  verify:
    name: Typecheck, i18n, Rules, Live Emulator, Build & Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Download Firebase Firestore Emulator JAR
        run: |
          mkdir -p ~/.cache/firebase/emulators
          if [ ! -f ~/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar ]; then
            curl -sSL https://storage.googleapis.com/firebase-preview-drop/emulator/cloud-firestore-emulator-v1.19.8.jar -o ~/.cache/firebase/emulators/cloud-firestore-emulator-v1.19.8.jar
          fi

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify FR/AR i18n key parity
        run: node scripts/check-i18n.mjs

      - name: Lint Firestore Security Rules
        run: npm run lint:rules

      - name: Production build (client + server)
        run: npm run build

      - name: Run unit, policy, live emulator, and routing tests
        run: npm test

      - name: Dependency security audit
        run: npm audit --audit-level=high

