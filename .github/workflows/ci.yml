name: CI Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  verify:
    name: Typecheck, i18n, Rules, Build & Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npm run lint

      - name: Verify FR/AR i18n key parity
        run: node scripts/check-i18n.mjs

      - name: Lint Firestore Security Rules
        run: npm run lint:rules

      - name: Production build (client + server)
        run: npm run build

      - name: Run unit, policy, and routing tests
        run: npm test
